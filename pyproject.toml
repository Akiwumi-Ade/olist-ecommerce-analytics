[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-commerce-analytics"
version = "0.1.0"
description = "A reproducible PostgreSQL ETL and analytics project using the Olist marketplace dataset"
requires-python = ">=3.9"
dependencies = [
  "pandas>=2.0,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "python-dotenv>=1.0,<2.0",
  "streamlit>=1.30,<2.0",
  "plotly>=5.18,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[project.scripts]
olist-etl = "olist_analytics.etl:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
